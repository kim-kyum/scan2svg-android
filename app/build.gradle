plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// 어떤 CPU용으로 만들지: 기본은 태블릿·폰(arm64)과 에뮬레이터(x86_64) 둘 다.
// 배포용은 -Pabis=arm64-v8a 로 하나만 넣어 APK 크기를 줄인다.
def abiList = (project.findProperty('abis') ?: 'arm64-v8a,x86_64').toString().split(',').collect { it.trim() }

android {
    namespace 'io.github.kimkyum.scan2svg'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.kimkyum.scan2svg"
        minSdk 24
        targetSdk 34
        versionCode((project.findProperty('buildNumber') ?: '1').toString().toInteger())
        versionName "0.1." + (project.findProperty('buildNumber') ?: '0')
        ndk { abiFilters.addAll(abiList) }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 시제품용 서명 키(비밀이 아님). 빌드마다 같은 키로 서명해야 앱을 지우지 않고 덮어 설치할 수 있다.
    signingConfigs {
        shared {
            storeFile file('scan2svg-prototype.jks')
            storePassword 'android'
            keyAlias 'scan2svg'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}

chaquopy {
    defaultConfig {
        version "3.11"
        pip {
            install "numpy"
            install "opencv-python"
            install "pillow"
            install "fonttools"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
