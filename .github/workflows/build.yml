name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 태블릿·폰용(arm64) APK를 만들어 Releases에 올린다
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK (arm64)
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug -Pabis=arm64-v8a -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p ci-out
          tail -n 250 build.log > ci-out/build-log-tail.txt || true
          grep -n -E "error:|^e: |FAILED|What went wrong|Could not|ERROR|No matching distribution|Chaquopy" build.log | head -n 150 > ci-out/errors.txt || true
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            cp "$APK" scan2svg.apk
            ls -l scan2svg.apk > ci-out/apk-info.txt
            unzip -l scan2svg.apk | sort -k1 -n -r | head -n 40 >> ci-out/apk-info.txt
          fi
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_NUMBER build=${{ steps.build.outcome }}" > ci-out/status.txt
      - name: Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: scan2svg 빌드 ${{ github.run_number }}
          body: 시제품 빌드입니다. scan2svg.apk를 내려받아 설치하세요(arm64 기기용).
          files: scan2svg.apk
          make_latest: true
      - name: Push results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/push_results.sh ci-build ci-out

  # 에뮬레이터에 깔아 예시 사진을 실제로 변환해 본다
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build app + test (x86_64)
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest -Pabis=x86_64 2>&1 | tee build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          script: bash ci/emulator_test.sh
      - name: Collect
        if: always()
        run: |
          mkdir -p ci-out
          tail -n 150 build.log > ci-out/build-log-tail.txt || true
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_NUMBER build=${{ steps.build.outcome }} emulator=${{ steps.emu.outcome }}" > ci-out/status.txt
      - name: Push results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/push_results.sh ci-test ci-out
